name: Docker Build & Publish
permissions:
  contents: read
  packages: write
  # Keyless cosign signing exchanges the workflow's OIDC identity for a
  # short-lived signing certificate (RMI-OMNIAGENT-034).
  id-token: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub mirror for discoverability (RMI-OMNIAGENT-033). GHCR is
  # canonical — Docker Hub throttles anonymous pulls, so production pulls
  # should use ghcr.io. Personal namespace: Docker Hub orgs are paid.
  DOCKERHUB_IMAGE: docker.io/grokify/omniagent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU covers the runtime stage's RUN steps for arm64; the Go build
      # itself cross-compiles natively (see Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Requires DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets (a
      # Docker personal access token with Read & Write scope).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=smoke,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit attestations: an SBOM (syft) and SLSA provenance are
          # attached to the pushed manifest (RMI-OMNIAGENT-034).
          sbom: true
          provenance: mode=max

      - name: Install cosign
        # cosign-installer publishes no floating major tag — pin exact.
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless signature over the pushed digest; verifiable with
      #   cosign verify \
      #     --certificate-identity-regexp 'github.com/plexusone/omniagent' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     ghcr.io/plexusone/omniagent:<tag>
      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"
