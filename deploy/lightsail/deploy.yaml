# LightSail deployment config for omniagent (RMI-OMNIAGENT-004), consumed
# by the `omnideploy` CLI's "omniagent" runtime adapter (detected via the
# gateway:/agent: top-level keys — see
# https://github.com/plexusone/omnideploy/blob/main/docs/runtimes/omniagent.md).
#
# Preview first (no changes applied — do this before every real `up`):
#   ANTHROPIC_API_KEY=... DISCORD_BOT_TOKEN=... SERPER_API_KEY=... \
#     omnideploy preview --config deploy/lightsail/deploy.yaml --target lightsail --backend pulumi
#
# Deploy:
#   ANTHROPIC_API_KEY=... DISCORD_BOT_TOKEN=... SERPER_API_KEY=... \
#     omnideploy up --config deploy/lightsail/deploy.yaml --target lightsail --backend pulumi
#
# Requires: AWS credentials in the environment, a Pulumi backend
# (PULUMI_BACKEND_URL + PULUMI_CONFIG_PASSPHRASE), and the image below
# already pushed + public on GHCR (RMI-OMNIAGENT-003 — push a `v*` tag, or
# run the "Docker Build & Publish" workflow manually for a :smoke build;
# either way, set the GHCR package visibility to Public once, by hand).
#
# Three things worth knowing, found by reading omnideploy's actual Go
# source (not just its docs) before writing this file — because it's about
# to touch real AWS infrastructure:
#
#   1. The omniagent adapter derives the LightSail container's *port* from
#      gateway.address, but does not also inject OMNIAGENT_GATEWAY_ADDRESS
#      into the container's environment. Without the explicit entry below,
#      the process inside the container binds to its own default
#      (127.0.0.1:18789), the health check hits the wrong port, and the
#      deployment never goes healthy.
#
#   2. Secrets flow through deploy.secrets (RMI-OMNIAGENT-006, shipped):
#      the Pulumi backend resolves env:/ssm:/secretsmanager: sources at
#      deploy time and injects them as Pulumi-secret env values (encrypted
#      in state). A missing/unset secret fails the deploy up front instead
#      of shipping a container with a silently absent credential.
#
#   3. Two fixes landed in the omnideploy repo itself (not this one)
#      alongside this file — pull the latest omnideploy (main, commit
#      04040a7 or later) before running this:
#        - ${VAR}/${VAR:-default} expansion: docs/configuration/schema.md
#          documented this syntax, but no code anywhere in the module
#          actually expanded it — every ${VAR} would have deployed as
#          the literal string (bfea43f).
#        - Deterministic adapter detection: this file's own name
#          ("deploy.yaml") happened to also match the generic
#          "container" adapter's broad filename heuristic, and which of
#          the two adapters won was randomized per run — it could load
#          fine one run and fail with "name is required" the next
#          (04040a7).

gateway:
  address: "0.0.0.0:8080" # must match the Dockerfile's EXPOSE/HEALTHCHECK port

agent:
  provider: anthropic
  model: claude-sonnet-5

deploy:
  name: omniagent-discord
  region: us-west-2
  image: ghcr.io/plexusone/omniagent:latest
  replicas: 1 # required — Discord's WebSocket connection is stateful (RMI-OMNIAGENT-008)
  resources:
    size: micro
  environment:
    OMNIAGENT_GATEWAY_ADDRESS: "0.0.0.0:8080"
    # Embedded web UI over the Lightsail HTTPS endpoint. Auth is REQUIRED
    # when the UI is exposed publicly — without it the chat page spends
    # the Anthropic key for anyone who finds the URL. Personal-mode auth
    # is magic-link; with no SMTP configured the link is printed to the
    # container log (aws lightsail get-container-log) — fetch it there to
    # sign in. Chat history is ephemeral: Lightsail containers have no
    # persistent volume, so the personal SQLite store resets on redeploy.
    OMNIAGENT_WEB_ENABLED: "true"
    OMNIAGENT_AUTH_ENABLED: "true"
    OMNIAGENT_AUTH_OWNER_EMAIL: ${OMNIAGENT_AUTH_OWNER_EMAIL}
    OMNIAGENT_AUTH_BASE_URL: "https://omniagent-discord.xdx76784ypt9m.us-west-2.cs.amazonlightsail.com"
  # Secrets resolve at deploy time (RMI-OMNIAGENT-006): SSM SecureString
  # values are fetched with the deploying profile's scoped IAM policy and
  # land in Pulumi state encrypted (pulumi.ToSecret), never plaintext.
  # Lightsail ceiling still applies: the resolved values are container
  # env vars visible in the Lightsail console (no task roles/valueFrom
  # there) — full runtime injection arrives with the ECS target.
  # Rotate by updating the SSM parameter and rerunning `omnideploy up`.
  secrets:
    - name: ANTHROPIC_API_KEY
      source: ssm:/omniagent/anthropic-api-key
    - name: DISCORD_BOT_TOKEN
      source: ssm:/omniagent/discord-bot-token
    - name: SERPER_API_KEY
      source: ssm:/omniagent/serper-api-key
